; ESP32-C3 SuperMini -- BLE sensor peripheral
;
; There is no stock board definition for the "SuperMini" clone, so we use the
; generic ESP32-C3 DevKitM-1 definition. It matches the SuperMini's chip
; (ESP32-C3 / RISC-V, 4 MB flash, 320 KB RAM). The only difference that matters
; is the pinout, and we only use GPIO8 for the on-board LED.

[env:esp32c3-supermini]
platform = espressif32@^7.1.3
board = esp32-c3-devkitm-1
framework = arduino

; The SuperMini has no USB-to-UART chip: the USB-C port is wired straight to the
; ESP32-C3's native USB peripheral. These two flags route Serial over that port
; so `pio device monitor` shows the printf output.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps = h2zero/NimBLE-Arduino@^2.5.1
